[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pace-mem"
version = "0.1.0"
description = "Prefix-Aware Complementary Evidence for Multimodal Agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "Shidu Ren", email = "ryan.ren@mail.utoronto.ca"},
  {name = "Rong-cheng Tu"},
  {name = "Hang Zhou"},
  {name = "Xiao Luo"},
]
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
models = [
  "sentence-transformers>=3.0",
  "torch>=2.2",
  "transformers>=4.51",
]

[project.scripts]
pace-mem = "pace_mem.cli:main"

[project.urls]
Repository = "https://github.com/Shidu-Ren/PACE-Mem"
Issues = "https://github.com/Shidu-Ren/PACE-Mem/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pace_mem*"]
